  mesh(rbox(2.2, 0.25, 1.2, 0.12), toon(C.snow), 0, 1.45, 0, g, { thin: true }); }
// снеговик с ведром и морковкой
{ const g = new THREE.Group(); g.position.set(-4.6, 0.3, 5.2); g.rotation.y = 0.5; scene.add(g);
  mesh(new THREE.SphereGeometry(0.85, 20, 16), toon(C.snow), 0, 0.75, 0, g); mesh(new THREE.SphereGeometry(0.6, 20, 16), toon(C.snow), 0, 1.85, 0, g); mesh(new THREE.SphereGeometry(0.42, 20, 16), toon(C.snow), 0, 2.65, 0, g);
  const nose = mesh(new THREE.ConeGeometry(0.08, 0.45, 10), toon(0xf08a24), 0, 2.65, 0.55, g, { thin: true }); nose.rotation.x = Math.PI / 2;
  for (const s of [-1, 1]) mesh(new THREE.SphereGeometry(0.06, 8, 6), toon(0x222222), s * 0.15, 2.78, 0.36, g, { thin: true });
  mesh(new THREE.CylinderGeometry(0.28, 0.34, 0.42, 14), toon(0x4a6ea8), 0, 3.12, 0, g);
  const sc = mesh(new THREE.TorusGeometry(0.42, 0.11, 8, 20), toon(C.red), 0, 2.3, 0, g); sc.rotation.x = Math.PI / 2; }
// санки
{ const g = new THREE.Group(); g.position.set(3.6, 0.28, 4.4); g.rotation.y = -0.6; scene.add(g);
  for (const s of [-1, 1]) { const r = mesh(new THREE.TorusGeometry(0.22, 0.05, 6, 12, Math.PI), toon(C.red), s * 0.32, 0.22, 0.65, g, { thin: true }); r.rotation.y = Math.PI / 2; mesh(rbox(0.08, 0.08, 1.4, 0.03), toon(C.red), s * 0.32, 0.05, 0, g, { thin: true }); }
  for (let i = 0; i < 4; i++) mesh(rbox(0.85, 0.06, 0.24, 0.03), toon(0xc8844f), 0, 0.3, -0.5 + i * 0.32, g, { thin: true }); }
// забор с шапками снега
for (let i = 0; i < 22; i++) {
  const a = -1.15 + i * 0.105, x = Math.sin(a) * 13, z = Math.cos(a) * 11.5;

// падающий снег

{ const n = 900, pos = new Float32Array(n * 3); for (let i = 0; i < n; i++) { pos[i * 3] = (rnd() - 0.5) * 50; pos[i * 3 + 1] = rnd() * 22; pos[i * 3 + 2] = (rnd() - 0.5) * 50; } flakes.geometry.setAttribute('position', new THREE.BufferAttribute(pos, 3)); scene.add(flakes); }

// ---------- свет и небо, три настроения ----------
const hemi = new THREE.HemisphereLight(0xbcd6ff, 0xf3e6da, 1.0); scene.add(hemi);

// ---------- постобработка: мягкое свечение окон и фонаря + виньетка ----------
const comp = new EffectComposer(R); comp.addPass(new RenderPass(scene, cam));
